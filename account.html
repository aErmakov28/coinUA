<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Особистий кабінет — CoinUA</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#F3F0EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0C0A" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      var t; try { t = localStorage.getItem('coinua:theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#account">Перейти до вмісту</a>

  <header class="site-header">
    <div class="container header-top">
      <a href="./" class="logo">coinUA/<span>atlas</span></a>
      <nav class="account account-nav-top" aria-label="Навігація">
        <a href="./" class="link-btn" style="display:inline-flex;align-items:center;text-decoration:none">← До каталогу</a>
        <span data-auth-slot class="auth-slot"></span>
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Темна тема" aria-pressed="false">
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="./#cart" class="btn btn-primary">Кошик · <span id="cartCount">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container page" id="account">
    <p class="crumbs">Каталог / Особистий кабінет</p>
    <div id="accountRoot" aria-live="polite">
      <p style="color:var(--muted)">Завантаження…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="logo">coinUA/<span>atlas</span></span>
      <span>Особистий кабінет</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
